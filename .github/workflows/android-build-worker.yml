
name: Andro Android Build Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: andro-android-build-worker
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    outputs:
      has_job: ${{ steps.claim.outputs.has_job }}
      job_id: ${{ steps.claim.outputs.job_id }}
      repo_url: ${{ steps.claim.outputs.repo_url }}
      ref: ${{ steps.claim.outputs.ref }}
      gradle_task: ${{ steps.claim.outputs.gradle_task }}
      android_platform: ${{ steps.claim.outputs.android_platform }}

    steps:
      - name: Validate worker configuration
        env:
          ANDRO_SERVER_URL: ${{ secrets.ANDRO_SERVER_URL }}
          ANDRO_WORKER_TOKEN: ${{ secrets.ANDRO_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${ANDRO_SERVER_URL:-}" ]] || {
            echo "::error::ANDRO_SERVER_URL is missing."
            exit 1
          }

          [[ -n "${ANDRO_WORKER_TOKEN:-}" ]] || {
            echo "::error::ANDRO_WORKER_TOKEN is missing."
            exit 1
          }

          node -e '
            const u = new URL(process.env.ANDRO_SERVER_URL);
            if (u.protocol !== "https:") {
              throw new Error("ANDRO_SERVER_URL must use HTTPS.");
            }
          '

      - name: Claim one queued build
        id: claim
        env:
          ANDRO_SERVER_URL: ${{ secrets.ANDRO_SERVER_URL }}
          ANDRO_WORKER_TOKEN: ${{ secrets.ANDRO_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            -X POST \
            "${ANDRO_SERVER_URL%/}/internal/worker/claim" \
            -H "Authorization: Bearer ${ANDRO_WORKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o "$RUNNER_TEMP/claim.json"

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + '/claim.json', 'utf8')
          );
          const output = process.env.GITHUB_OUTPUT;

          if (!data.job) {
            fs.appendFileSync(output, 'has_job=false\n');
            console.log('No queued Andro builds.');
            process.exit(0);
          }

          const job = data.job;
          const values = {
            has_job: 'true',
            job_id: job.id,
            repo_url: job.repoUrl,
            ref: job.ref || 'main',
            gradle_task: job.task || 'assembleDebug',
            android_platform: String(job.androidPlatform || 36)
          };

          for (const [key, value] of Object.entries(values)) {
            const text = String(value ?? '');

            if (!text || /[\r\n]/.test(text)) {
              throw new Error('Invalid claimed job field: ' + key);
            }

            fs.appendFileSync(output, key + '=' + text + '\n');
          }

          console.log('Claimed build ' + job.id);
          NODE

      - name: Report empty queue
        if: steps.claim.outputs.has_job != 'true'
        run: echo "Worker checked the queue; no build was waiting."

  build:
    needs: claim
    if: ${{ needs.claim.result == 'success' && needs.claim.outputs.has_job == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    outputs:
      build_result: ${{ steps.compile.outputs.build_result }}
      build_error: ${{ steps.compile.outputs.build_error }}

    steps:
      - name: Validate build request
        env:
          REPO_URL: ${{ needs.claim.outputs.repo_url }}
          PROJECT_REF: ${{ needs.claim.outputs.ref }}
          GRADLE_TASK: ${{ needs.claim.outputs.gradle_task }}
          ANDROID_PLATFORM: ${{ needs.claim.outputs.android_platform }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const u = new URL(process.env.REPO_URL);
          const hosts = new Set([
            'github.com',
            'gitlab.com',
            'bitbucket.org'
          ]);

          if (
            u.protocol !== 'https:' ||
            !hosts.has(u.hostname.toLowerCase()) ||
            u.username || u.password || u.port || u.search || u.hash ||
            u.pathname.split('/').filter(Boolean).length < 2
          ) {
            throw new Error('Unsupported or invalid public repository URL.');
          }

          const ref = process.env.PROJECT_REF;
          if (
            !/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(ref) ||
            ref.includes('..') || ref.includes('//')
          ) {
            throw new Error('Invalid Git reference.');
          }

          if (!/^[A-Za-z0-9:_-]+$/.test(process.env.GRADLE_TASK)) {
            throw new Error('Invalid Gradle task.');
          }

          if (process.env.ANDROID_PLATFORM !== '36') {
            throw new Error('Only Android SDK platform 36 is supported.');
          }
          NODE

      - name: Checkout requested project
        env:
          REPO_URL: ${{ needs.claim.outputs.repo_url }}
          PROJECT_REF: ${{ needs.claim.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PROJECT_REF" -- "$REPO_URL" project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        env:
          ANDROID_PLATFORM: ${{ needs.claim.outputs.android_platform }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;36.0.0"

      - name: Compile Android project
        id: compile
        env:
          GRADLE_TASK: ${{ needs.claim.outputs.gradle_task }}
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$RUNNER_TEMP/andro-output"
          : > "$RUNNER_TEMP/gradle.log"
          : > "$RUNNER_TEMP/build-error.txt"

          echo "build_result=failure" >> "$GITHUB_OUTPUT"
          echo "build_error=Build did not complete successfully." >> "$GITHUB_OUTPUT"

          if [[ ! -f project/gradlew ]]; then
            echo "Gradle wrapper was not found." \
              | tee "$RUNNER_TEMP/build-error.txt"
            echo "build_error=Gradle wrapper was not found." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x project/gradlew

          set +e
          (
            cd project
            ./gradlew --no-daemon "$GRADLE_TASK"
          ) 2>&1 | tee "$RUNNER_TEMP/gradle.log"

          result=${PIPESTATUS[0]}
          set -e

          find project -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -path '*/build/outputs/*' \
            -exec cp --parents {} "$RUNNER_TEMP/andro-output/" \; \
            || true

          artifact="$(find "$RUNNER_TEMP/andro-output" -type f \
            \( -name '*.apk' -o -name '*.aab' \) -print -quit)"

          if [[ "$result" -ne 0 ]]; then
            message="Gradle exited with code $result."
            echo "$message" | tee "$RUNNER_TEMP/build-error.txt"
            echo "build_error=$message" >> "$GITHUB_OUTPUT"
          elif [[ -z "$artifact" ]]; then
            message="Gradle succeeded but produced no APK or AAB."
            echo "$message" | tee "$RUNNER_TEMP/build-error.txt"
            echo "build_error=$message" >> "$GITHUB_OUTPUT"
          else
            echo "build_result=success" >> "$GITHUB_OUTPUT"
            echo "build_error=" >> "$GITHUB_OUTPUT"
            echo "Build produced an Android artifact."
          fi

      - name: Upload temporary build output and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: andro-build-${{ needs.claim.outputs.job_id }}
          path: |
            ${{ runner.temp }}/andro-output/
            ${{ runner.temp }}/gradle.log
            ${{ runner.temp }}/build-error.txt
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [claim, build]
    if: ${{ always() && needs.claim.result == 'success' && needs.claim.outputs.has_job == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download build output and logs
        uses: actions/download-artifact@v4
        with:
          name: andro-build-${{ needs.claim.outputs.job_id }}
          path: build-output
        continue-on-error: true

      - name: Persist Gradle logs
        env:
          ANDRO_SERVER_URL: ${{ secrets.ANDRO_SERVER_URL }}
          ANDRO_WORKER_TOKEN: ${{ secrets.ANDRO_WORKER_TOKEN }}
          JOB_ID: ${{ needs.claim.outputs.job_id }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ ! -f build-output/gradle.log ]]; then
            echo "No Gradle log was available to persist."
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');

          const base = process.env.ANDRO_SERVER_URL.replace(/\/$/, '');
          const token = process.env.ANDRO_WORKER_TOKEN;
          const jobId = encodeURIComponent(process.env.JOB_ID);
          const lines = fs.readFileSync('build-output/gradle.log', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .slice(-250);

          (async () => {
            for (const line of lines) {
              try {
                const response = await fetch(
                  base + '/internal/jobs/' + jobId + '/logs',
                  {
                    method: 'POST',
                    headers: {
                      authorization: 'Bearer ' + token,
                      'content-type': 'application/json'
                    },
                    body: JSON.stringify({ line: line.slice(0, 4000) })
                  }
                );

                if (!response.ok) {
                  console.error('Log persistence returned HTTP ' + response.status);
                  break;
                }
              } catch (error) {
                console.error('Log persistence failed:', error.message);
                break;
              }
            }
          })();
          NODE

      - name: Upload artifact and report final build status
        env:
          ANDRO_SERVER_URL: ${{ secrets.ANDRO_SERVER_URL }}
          ANDRO_WORKER_TOKEN: ${{ secrets.ANDRO_WORKER_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANDRO_ARTIFACT_BUCKET: ${{ secrets.ANDRO_ARTIFACT_BUCKET }}
          JOB_ID: ${{ needs.claim.outputs.job_id }}
          BUILD_RESULT: ${{ needs.build.outputs.build_result }}
          BUILD_ERROR: ${{ needs.build.outputs.build_error }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${ANDRO_SERVER_URL:-}" ]] || {
            echo "::error::ANDRO_SERVER_URL is missing."
            exit 1
          }
          [[ -n "${ANDRO_WORKER_TOKEN:-}" ]] || {
            echo "::error::ANDRO_WORKER_TOKEN is missing."
            exit 1
          }
          [[ -n "${JOB_ID:-}" ]] || {
            echo "::error::Build job ID is missing."
            exit 1
          }

          bucket="${ANDRO_ARTIFACT_BUCKET:-andro-artifacts}"
          status="failed"
          error_message="${BUILD_ERROR:-The worker failed before reporting a successful build.}"
          artifact_path=""

          if [[ "${BUILD_RESULT:-failure}" == "success" ]]; then
            status="succeeded"
            error_message=""
          fi

          artifact="$(find build-output -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -print -quit 2>/dev/null || true)"

          if [[ "$status" == "succeeded" && -z "$artifact" ]]; then
            status="failed"
            error_message="Build succeeded without a downloadable APK/AAB."
          fi

          if [[ -n "$artifact" && "$status" == "succeeded" ]]; then
            if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
              status="failed"
              error_message="Supabase Storage secrets are missing."
            else
              filename="$(basename "$artifact")"
              artifact_path="$JOB_ID/$filename"

              encoded_path="$(node -e '
                process.stdout.write(
                  process.argv[1].split("/").map(encodeURIComponent).join("/")
                )
              ' "$artifact_path")"

              if ! curl --fail-with-body --silent --show-error \
                --connect-timeout 15 --max-time 300 \
                -X POST \
                "${SUPABASE_URL%/}/storage/v1/object/$bucket/$encoded_path" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/octet-stream" \
                -H "x-upsert: true" \
                --data-binary "@$artifact"; then
                status="failed"
                error_message="APK/AAB upload to Supabase Storage failed."
                artifact_path=""
              fi
            fi
          fi

          node -e '
            const p = { status: process.argv[1] };
            if (process.argv[2]) p.artifactPath = process.argv[2];
            if (process.argv[3]) p.error = process.argv[3];
            p.log = "GitHub Actions worker completed; final status: " + p.status;
            process.stdout.write(JSON.stringify(p));
          ' "$status" "$artifact_path" "$error_message" \
            > "$RUNNER_TEMP/andro-status.json"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            -X POST \
            "${ANDRO_SERVER_URL%/}/internal/jobs/$JOB_ID/status" \
            -H "Authorization: Bearer $ANDRO_WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/andro-status.json"

          echo "Andro job $JOB_ID reported as $status."
