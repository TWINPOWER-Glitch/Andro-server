name: Andro Android Build Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: andro-android-build-worker
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    outputs:
      has_job: ${{ steps.claim.outputs.has_job }}
      job_id: ${{ steps.claim.outputs.job_id }}
      repo_url: ${{ steps.claim.outputs.repo_url }}
      ref: ${{ steps.claim.outputs.ref }}
      gradle_task: ${{ steps.claim.outputs.gradle_task }}
      android_platform: ${{ steps.claim.outputs.android_platform }}

    steps:
      - name: Claim one queued build
        id: claim
        env:
          ANDRO_SERVER_URL: ${{ secrets.ANDRO_SERVER_URL }}
          ANDRO_WORKER_TOKEN: ${{ secrets.ANDRO_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDRO_SERVER_URL:-}" || -z "${ANDRO_WORKER_TOKEN:-}" ]]; then
            echo "::error::Configure ANDRO_SERVER_URL and ANDRO_WORKER_TOKEN."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "${ANDRO_SERVER_URL%/}/internal/worker/claim" \
            -H "Authorization: Bearer ${ANDRO_WORKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' > "$RUNNER_TEMP/claim.json"

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + '/claim.json', 'utf8')
          );
          const job = data.job;
          const output = process.env.GITHUB_OUTPUT;

          if (!job) {
            fs.appendFileSync(output, 'has_job=false\n');
          } else {
            const values = {
              has_job: 'true',
              job_id: job.id,
              repo_url: job.repoUrl,
              ref: job.ref || 'main',
              gradle_task: job.task || 'assembleDebug',
              android_platform: String(job.androidPlatform || 36)
            };

            for (const [key, value] of Object.entries(values)) {
              const text = String(value);
              if (/[\r\n]/.test(text)) {
                throw new Error(`Invalid newline in ${key}`);
              }
              fs.appendFileSync(output, `${key}=${text}\n`);
            }
          }
          NODE

      - name: Report empty queue
        if: steps.claim.outputs.has_job != 'true'
        run: echo "No queued Andro build jobs."

  build:
    needs: claim
    if: needs.claim.outputs.has_job == 'true'
    runs-on: ubuntu-latest

    outputs:
      build_result: ${{ steps.compile.outputs.build_result }}

    steps:
      - name: Validate and checkout requested project
        env:
          REPO_URL: ${{ needs.claim.outputs.repo_url }}
          PROJECT_REF: ${{ needs.claim.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail

          # Only public HTTPS Git repositories are accepted.
          node -e '
            const u = new URL(process.env.REPO_URL);
            if (u.protocol !== "https:" || u.hostname !== "github.com") {
              throw new Error("Only HTTPS repositories hosted on github.com are supported.");
            }
          '

          git clone --depth 1 --branch "$PROJECT_REF" "$REPO_URL" project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        env:
          ANDROID_PLATFORM: ${{ needs.claim.outputs.android_platform }}
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;36.0.0"

      - name: Compile Android project
        id: compile
        env:
          GRADLE_TASK: ${{ needs.claim.outputs.gradle_task }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/andro-output"

          if [[ ! -f project/gradlew ]]; then
            echo "build_result=failure" >> "$GITHUB_OUTPUT"
            echo "Gradle wrapper was not found." > "$RUNNER_TEMP/build-error.txt"
            exit 0
          fi

          cd project
          chmod +x ./gradlew

          set +e
          ./gradlew --no-daemon "$GRADLE_TASK" 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"
          result=${PIPESTATUS[0]}
          set -e

          find . -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -path '*/build/outputs/*' \
            -exec cp --parents {} "$RUNNER_TEMP/andro-output/" \;

          if [[ "$result" -eq 0 ]]; then
            echo "build_result=success" >> "$GITHUB_OUTPUT"
          else
            echo "build_result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload temporary build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-build-${{ needs.claim.outputs.job_id }}
          path: |
            ${{ runner.temp }}/andro-output/
            ${{ runner.temp }}/gradle.log
            ${{ runner.temp }}/build-error.txt
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [claim, build]
    if: always() && needs.claim.outputs.has_job == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download temporary build output
        uses: actions/download-artifact@v4
        with:
          name: andro-build-${{ needs.claim.outputs.job_id }}
          path: build-output
        continue-on-error: true

      - name: Upload artifact and report build status
        env:
          ANDRO_SERVER_URL: ${{ secrets.ANDRO_SERVER_URL }}
          ANDRO_WORKER_TOKEN: ${{ secrets.ANDRO_WORKER_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ needs.claim.outputs.job_id }}
          BUILD_RESULT: ${{ needs.build.outputs.build_result }}
        shell: bash
        run: |
          set -euo pipefail

          status="failed"
          error_message="Android build failed. Inspect the GitHub Actions logs."
          artifact_path=""

          if [[ "${BUILD_RESULT:-failure}" == "success" ]]; then
            status="succeeded"
            error_message=""
          fi

          artifact="$(find build-output -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -print -quit 2>/dev/null || true)"

          if [[ -n "$artifact" ]]; then
            if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
              status="failed"
              error_message="Supabase Storage secrets are missing."
            else
              filename="$(basename "$artifact")"
              artifact_path="$JOB_ID/$filename"

              encoded_path="$(node -e '
                process.stdout.write(
                  process.argv[1].split("/").map(encodeURIComponent).join("/")
                )
              ' "$artifact_path")"

              curl --fail-with-body --silent --show-error \
                -X POST \
                "${SUPABASE_URL%/}/storage/v1/object/andro-artifacts/$encoded_path" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/octet-stream" \
                -H "x-upsert: true" \
                --data-binary "@$artifact"
            fi
          fi

          payload="$(node -e '
            const p = {status: process.argv[1]};
            if (process.argv[2]) p.artifactPath = process.argv[2];
            if (process.argv[3]) p.error = process.argv[3];
            process.stdout.write(JSON.stringify(p));
          ' "$status" "$artifact_path" "$error_message")"

          curl --fail-with-body --silent --show-error \
            -X POST \
            "${ANDRO_SERVER_URL%/}/internal/jobs/$JOB_ID/status" \
            -H "Authorization: Bearer $ANDRO_WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"
